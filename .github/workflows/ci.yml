name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Lint development scripts
        run: shellcheck scripts/development/*.sh

      - name: Create local environment file
        run: |
          cp .env.example .env
          sed -i "s/^SPRING_DATASOURCE_PASSWORD=.*/SPRING_DATASOURCE_PASSWORD=$(openssl rand -hex 24)/" .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL with Docker Compose
        run: docker compose up --detach --wait postgres

      - name: Smoke test against Docker Compose PostgreSQL
        run: |
          set -a
          . ./.env
          set +a
          scripts/development/smoke-test.sh backend/target/tracelite-backend.jar

      - name: Stop Docker Compose services
        if: always() && hashFiles('.env') != ''
        run: docker compose down --volumes
