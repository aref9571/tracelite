name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Lint shell scripts
        run: shellcheck scripts/development/*.sh scripts/ci/*.sh

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.14.0 < backend/Dockerfile

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "${PWD}:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify 2>&1 | tee build.log

      - name: Compile ingestion benchmark
        run: javac -Werror -Xlint:all -d "${RUNNER_TEMP}/benchmark" scripts/benchmark/IngestionBenchmark.java

      - name: Summarize test results
        if: always()
        run: scripts/ci/summarize-tests.sh backend/target/surefire-reports

      - name: Summarize coverage
        if: always()
        run: scripts/ci/summarize-coverage.sh backend/target/site/jacoco/jacoco.csv

      - name: Upload coverage report
        if: always() && hashFiles('backend/target/site/jacoco/index.html') != ''
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: backend/target/site/jacoco
          retention-days: 14

      - name: Annotate build and test failures
        if: failure()
        run: scripts/ci/annotate-failures.sh build.log backend/target/surefire-reports

      - name: Create local environment file
        run: scripts/ci/create-env-file.sh smoke-test-service

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL with Docker Compose
        run: docker compose up --detach --wait postgres

      - name: Smoke test against Docker Compose PostgreSQL
        run: |
          set -a
          . ./.env
          set +a
          scripts/development/smoke-test.sh backend/target/tracelite-backend.jar

      - name: Stop Docker Compose services
        if: always() && hashFiles('.env') != ''
        run: docker compose down --volumes

  frontend:
    name: Frontend build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type check and build
        run: npm run build

  docker:
    name: Docker image and Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create local environment file
        run: scripts/ci/create-env-file.sh stack-test-service

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: docker compose build backend

      - name: Test the Docker Compose stack
        run: |
          set -a
          . ./.env
          set +a
          scripts/development/docker-stack-test.sh

      - name: Show container logs
        if: failure() && hashFiles('.env') != ''
        run: docker compose logs

      - name: Stop Docker Compose services
        if: always() && hashFiles('.env') != ''
        run: docker compose down --volumes
