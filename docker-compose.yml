name: tracelite

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tracelite
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-tracelite}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${TRACELITE_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: tracelite-backend
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tracelite
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:${TRACELITE_BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
